pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'ParchmentMC'
            url = 'https://maven.parchmentmc.org'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = 'Contemporary-Pentalogy'

// 前置库 / Prerequisite libs
include 'Iktaun-Model-Loader'
include 'iktaun-GUI-loader'

// 现代五部曲 / The Contemporary Pentalogy
include 'The-New-Developing-Age'
include 'contemporary-construction'
include 'Peace-And-War'
include 'Contemporary_Agriculture'
include 'Cyberpunk-World'